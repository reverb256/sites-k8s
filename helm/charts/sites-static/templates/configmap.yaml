apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html/site;
      index index.html;

      add_header X-Served-By "sites-k8s" always;

      location / {
        try_files $uri $uri/ =404;
      }

      # Private previews: token-gated paths must never be indexed
      location /preview/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
      }
    }
