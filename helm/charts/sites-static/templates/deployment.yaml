apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 65533
      # zephyr is LAST-RESORT for scheduling (j_kro directive 2026-09-22):
      # never schedule here; prefer nexus/sentry.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["zephyr"]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["nexus"]
            - weight: 90
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["sentry"]
        podAntiAffinity:
          # One replica per node — a second pod on the same node adds nothing.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ .Release.Name }}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: {{ .Values.image.nginx | quote }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: www
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}
        - name: git-sync
          image: {{ .Values.image.gitSync | quote }}
          args:
            - --repo={{ .Values.git.repo }}
            - --ref={{ .Values.git.branch }}
            - --period={{ .Values.git.period }}
            - --root=/git
            # v4 renamed --dest to --link (git-sync itself logged the
            # deprecation: "Flag --dest has been deprecated, use --link").
            - --link=site
            - --depth=1
            # maxFailures defaults to 0 = abort on the FIRST failed sync, which
            # is what exited 1 on a transient "Could not resolve host".
            - --max-failures={{ .Values.git.maxFailures }}
          volumeMounts:
            - name: www
              mountPath: /git
          resources:
            {{- toYaml .Values.resources.gitSync | nindent 12 }}
      volumes:
        - name: www
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: {{ .Release.Name }}-nginx
