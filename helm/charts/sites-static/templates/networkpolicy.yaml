{{/*
  sites-static - network isolation (breach containment).

  Namespace policy layout (two charts share ns `sites`):
  - THIS chart owns the namespace-wide default-deny (catches every pod,
    including unlabeled strays).
  - Every allow is label-scoped so one chart's grants never cover the
    other app's pods (found and fixed during bring-up: ns-wide allows in
    content-site would have leaked internet egress to sites-static).
  - 10.1.1.0/24 sources = Calico pre-DNAT service flows (see quill rollout).
  Static file server: no internet egress is granted at all.
*/}}
{{- $ns := .Release.Namespace }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sites-static-default-deny
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sites-static-allow-dns
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels: {app: sites-static}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sites-static-allow-intra
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels: {app: sites-static}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: sites-static}
        - ipBlock: {cidr: 10.1.1.0/24}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector:
            matchLabels: {app: sites-static}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sites-static-allow-edge
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels: {app: sites-static}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media-reverse-proxy
        - ipBlock: {cidr: 10.1.1.0/24}
      ports:
        - {protocol: TCP, port: 8080}
