apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.envSecret.name }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.envSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: {{ .Values.envSecret.name }}
    creationPolicy: Owner
  data:
    # Bitwarden item `site-agency-env` holds the whole .env file body as its
    # raw (non-JSON) value. Do NOT set remoteRef.property: the BSM secret value
    # is plain text, not a JSON object with an `env` key. Requesting a property
    # on a non-JSON value makes ESO/ESO-sdk report "no secret found ... and
    # name site-agency-env" (observed Degraded). See grafana-admin ES for the
    # no-property pattern that syncs clean.
    - secretKey: env
      remoteRef:
        key: {{ .Values.envSecret.remoteKey }}
