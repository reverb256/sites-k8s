apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.envSecret.name }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.envSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: {{ .Values.envSecret.name }}
    creationPolicy: Owner
  data:
    # Bitwarden item `site-agency-env`, field `env` = the whole .env file body.
    - secretKey: env
      remoteRef:
        key: {{ .Values.envSecret.remoteKey }}
        property: env
