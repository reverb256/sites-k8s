apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: content-site
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: sites
  source:
    repoURL: https://github.com/reverb256/sites-k8s.git
    targetRevision: main
    path: helm/charts/content-site
    helm:
      releaseName: content-site
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
